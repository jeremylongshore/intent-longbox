name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"

# Third-party actions are SHA-pinned (Dependabot github-actions bumps the pin + comment).
#   actions/checkout    v4 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node  v4 -> 49933ea5288caeca8642d1e84afbd3f7d6820020
#   gitleaks/gitleaks-action v2 -> ff98106e4c7b2bc287b24eaf42907196329070c7
#   google/osv-scanner-action v2.5.1 -> 6e4298ebc4db23e847df9b2e2de2939d6f066c67

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack (pnpm pinned via package.json packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier check
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm typecheck

  test:
    name: Unit tests + coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Vitest with coverage (line 80 floor on src/services + src/providers)
        run: pnpm test:coverage

  architecture:
    name: Architecture gate
    runs-on: ubuntu-latest
    # 029 §5 move 8 (E02-B10): the module boundary stops being prose enforced by
    # review and becomes a required check. TWO halves, because one cannot do the job
    # — `depcruise` reads the import graph, and 029 records that the real damage in
    # `src/routes/scanSessions.ts` is `db.query` on a Pool passed as a PARAMETER,
    # which has no import edge to see. `pnpm arch` is the non-graph half (042 I5's
    # no-SELECT-*, 042 I22's lock-order lint, 040 §8.2's writer inventory, and the
    # cost_log single-writer rule).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 047 A8's paired-edit rule is a property of the DIFF, so the gate needs
          # real history to compute one — the merge base on a PR, and
          # `github.event.before` on a push. Full depth here is what lets the step
          # below fetch a base ref WITHOUT `--depth=1`: a shallow base plus a
          # shallow HEAD can fail to find a merge base at all, and the failure
          # mode is a diff that lists far more files than the change touched.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: dependency-cruiser (029 §3.3 module boundaries; every rule an error)
        run: pnpm depcruise
      - name: Non-graph rules (029 N2, 042 I5, 042 I22, 040 §8.2 step 1, 047 A8)
        run: pnpm arch
      # 047 A8, second half: a change that edits BOTH `identityKey` and one of the
      # catalog identity files without a 000-docs/006 row FAILS. Editing both
      # sides in one diff is by construction a change to a 019 measurement rule,
      # and `019:57` makes T1's field exclusion non-editable without that row.
      #
      # ⚠ RUN ON PUSH TO `main` AS WELL, and not only on pull_request. An earlier
      # version of this comment claimed "a push to main has no diff to ask the
      # question of", which is false: a push has `github.event.before`, and
      # `main` accepts direct commits under CLAUDE.md's paperwork rule and an
      # owner bypass (`enforce_admins` is off). A rule that only ever runs on the
      # PR path is a rule with a documented way around it.
      #
      # The first push of a branch — and a force-push that rewrites history —
      # reports `before` as all-zeros, which names no commit; there is no diff to
      # take, so the step compares against the merge base instead and, failing
      # that, skips loudly rather than failing the build on a ref that does not
      # exist.
      - name: Paired-edit rule over this change's diff (047 A8)
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" != "$ZERO" ]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            echo "paired-edit rule: no previous commit on this ref (first push or history rewrite) — skipping"
            exit 0
          fi
          git diff --name-only "$RANGE" > /tmp/changed-files.txt
          pnpm arch --changed /tmp/changed-files.txt

  integration:
    name: Postgres integration + HTTP smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: longbox
          POSTGRES_PASSWORD: longbox
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U longbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Provision the two database roles (E02-D06 role separation)
        # A service container cannot mount /docker-entrypoint-initdb.d — the repo
        # is not checked out when it starts — so the SAME file docker-compose.test.yml
        # mounts is piped through psql here. Every statement in it is guarded, so
        # running it against an already-initialised cluster is a no-op.
        #
        # Only `00-roles.sql` is piped, NOT `01-dev-database.sql`: the integration
        # lane creates a throwaway database per test file (helpers.ts) and never
        # touches the `longbox` dev database that file exists to create.
        run: psql "$TEST_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f docker/postgres-init/00-roles.sql
        env:
          TEST_DATABASE_ADMIN_URL: postgres://longbox:longbox@localhost:54329/postgres
      - name: Integration lane (migrations, append-only triggers, scan-session flow, HTTP smoke)
        # CI=true makes probeDb() throw instead of skip when Postgres is unreachable,
        # so this job cannot go green with zero tests executed.
        run: pnpm test:integration
        env:
          TEST_DATABASE_ADMIN_URL: postgres://longbox:longbox@localhost:54329/postgres

  security:
    name: Secret scan + dependency audit
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API (needs pull-requests: read);
    # PR comments are disabled so it never needs write.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (secrets in history and working tree)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: osv-scanner (dependency vulnerabilities from osv.dev, any known vuln blocks)
        # Replaced `pnpm audit` on 2026-09-03: the npm registry's audit endpoint timed out
        # (ERR_SOCKET_TIMEOUT) on three consecutive runs. osv.dev is an independent source
        # that carries the same GHSA advisories; scanning the lockfile needs no install.
        # To ignore a specific advisory add it to an osv-scanner.toml with a reason.
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=table

  bead-link:
    name: PR names its bead
    runs-on: ubuntu-latest
    # Beads are the work truth and the PR is the code evidence for exactly one of
    # them (CLAUDE.md § Governance, "Bead <-> PR linkage"; 023 §3/§5). This job makes
    # that linkage machine-checkable. Needs no checkout — the body is in the event.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: 'PR body must carry a line matching "Bead: longbox-"'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Write to a file first: piping into `grep -m1` under `pipefail` can fail the
          # step on EPIPE rather than on a missing bead line.
          printf '%s\n' "$PR_BODY" > pr_body.txt
          # The Bead line must be within the first five lines (the template's first line).
          if head -n 5 pr_body.txt | grep -qE '^[[:space:]]*Bead:[[:space:]]*longbox-'; then
            echo "OK: $(grep -E '^[[:space:]]*Bead:' pr_body.txt | head -n 1)"
            exit 0
          fi
          echo "::error::PR body must contain a line matching '^Bead: longbox-…'." >&2
          echo "Add it as the first line of the description, e.g.:" >&2
          echo "  Bead: longbox-e5b.15.1 (E15-B01) — Repair repository references and define …" >&2
          echo "Use the bead ID from 'bd show', not the alias alone. See .github/pull_request_template.md." >&2
          exit 1

  # ── Harness gates ──
  # verify + escape-scan are deterministic (hash manifest, policy-floor diff) and were
  # promoted to blocking on 2026-09-02 after a clean observe window. conform stays advisory
  # per the gate-promotion policy (docs/gate-promotion.md in @intentsolutions/audit-harness).

  harness-verify:
    name: audit-harness verify + escape-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify hash-pinned artifacts
        run: pnpm exec audit-harness verify
      - name: Escape-scan the branch range
        run: |
          git fetch origin main:refs/remotes/origin/main || true
          pnpm exec audit-harness escape-scan --range origin/main..HEAD

  harness-conform:
    name: audit-harness conform (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Conformance gates
        run: pnpm exec audit-harness conform .
