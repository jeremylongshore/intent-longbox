# Throwaway Postgres for the integration/smoke test lane.
#   docker compose -f docker-compose.test.yml up -d
#   pnpm test:integration
#   docker compose -f docker-compose.test.yml down -v
# Port 54329 avoids colliding with any local Postgres on 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: longbox
      POSTGRES_PASSWORD: longbox
      POSTGRES_DB: postgres
    # Provisions longbox_migrate (owns the schema) and longbox_app (DML only) on
    # first start, so the integration lane runs migrations as one role and the
    # app tests as the other (E02-D06). The same file is applied in CI.
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longbox"]
      interval: 2s
      timeout: 3s
      retries: 15
